[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PySPLIT"
version = "0.3.6.1"
description = "HYSPLIT trajectory analysis, automation, & visualization"
readme = "README.md"
license = {text = "Modified BSD"}
authors = [
    {name = "Mellissa S. C. Warner", email = "mellissa.s.c.warner@gmail.com"}
]
maintainers = [
    {name = "Mellissa S. C. Warner", email = "mellissa.s.c.warner@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "geopandas>=0.8.0",
    "cartopy>=0.20.0",
    "pandas>=1.2.0",
    "shapely>=1.7.0",
    "fiona>=1.8.0",
    "six>=1.15.0",
]

[project.optional-dependencies]
basemap = ["basemap>=1.0"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "isort>=5.0",
]

[project.urls]
Homepage = "https://github.com/mscross/pysplit"
Documentation = "https://pysplit.readthedocs.io/"
Repository = "https://github.com/mscross/pysplit.git"
"Bug Tracker" = "https://github.com/mscross/pysplit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pysplit*"]

[tool.setuptools.package-data]
pysplit = ["*.py"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["pysplit/tests"]
addopts = "-v --tb=short"
